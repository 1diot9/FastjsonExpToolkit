services:
  json-fingerprint-lab:
    build:
      context: ./json-fingerprint-lab
      dockerfile: Dockerfile
    image: fastjson-exp-toolkit/json-fingerprint-lab:1.0.0
    container_name: json-fingerprint-lab
    ports:
      - "${LAB_PORT_JSON_FINGERPRINT:-18080}:18080"
    environment:
      SERVER_PORT: "18080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Fastjson version matrix (safe + autotype endpoints)
  fj-1-2-30:
    build:
      context: ./fastjson-version-lab
      dockerfile: Dockerfile
      args:
        FASTJSON_VERSION: "1.2.30"
    image: fastjson-exp-toolkit/fastjson-version-lab:1.2.30
    container_name: fj-1-2-30
    ports:
      - "${LAB_PORT_FJ_1_2_30:-18030}:18080"
    environment:
      SERVER_PORT: "18080"
      FASTJSON_LAB_VERSION: "1.2.30"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 25s
    restart: unless-stopped

  fj-1-2-47:
