services:
  json-fingerprint-lab:
    build:
      context: ./json-fingerprint-lab
      dockerfile: Dockerfile
    image: fastjson-exp-toolkit/json-fingerprint-lab:1.0.0
    container_name: json-fingerprint-lab
    ports:
      - "18080:18080"
    environment:
      SERVER_PORT: "18080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
