[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastjson-exp-toolkit"
version = "0.1.0"
description = "Fastjson identification, versioning and PoC toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "scalar-fastapi>=1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
fjtoolkit = "fastjson_toolkit.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fastjson_toolkit.poc.memshell" = ["jars/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# tests/lab/ 为手动靶场脚本，命名已避开 test_*.py；显式排除以免误收集
norecursedirs = ["lab", ".*", "build", "dist", "*.egg"]
